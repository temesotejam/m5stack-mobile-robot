name: Build firmware and deploy web flasher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade platformio
          python -m pip install esptool==4.7.0

      - name: Build M5Stack Basic firmware
        run: pio run -e m5stack-basic

      - name: Package firmware and web flasher
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR=".pio/build/m5stack-basic"
          mkdir -p site/firmware
          cp web/index.html site/index.html

          BOOT_APP0="$(find "$HOME/.platformio/packages" -type f -name boot_app0.bin -print -quit)"
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin was not found in the PlatformIO framework package."
            exit 1
          fi

          test -s "$BUILD_DIR/bootloader.bin"
          test -s "$BUILD_DIR/partitions.bin"
          test -s "$BUILD_DIR/firmware.bin"

          python -m esptool --chip esp32 merge_bin \
            -o site/firmware/mobile-robot.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 16MB \
            0x1000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

          VERSION="$(echo "$GITHUB_SHA" | cut -c1-7)"
          cat > site/firmware/manifest.json <<EOF
          {
            "name": "M5Stack Mobile Robot",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "mobile-robot.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

          echo "Packaged firmware version: ${VERSION}"
          ls -lh site/firmware

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
